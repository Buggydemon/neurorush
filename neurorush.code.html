<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuroRush</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #050505;
            color: #e0e0e0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(50, 255, 50, 0.04) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .glitch-effect {
            animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Specific Game Elements */
        .spot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 300px;
            height: 300px;
        }
        .spot-cell {
            background-color: #333;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .spot-cell:active {
            transform: scale(0.95);
        }

        .bar-container {
            width: 80%;
            height: 40px;
            background: #222;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid #444;
        }
        .target-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20%; /* gets smaller */
            background: rgba(0, 255, 0, 0.2);
            border-left: 2px solid #00ff00;
            border-right: 2px solid #00ff00;
            z-index: 1;
        }
        .moving-marker {
            position: absolute;
            top: 2px;
            bottom: 2px;
            width: 6px;
            background: #fff;
            border-radius: 3px;
            left: 0%;
            z-index: 2;
        }

        .arrow-key-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
        }
        .arrow-key-btn:active {
            background: rgba(255,255,255,0.3);
        }

        #timer-bar {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center crt select-none">

    <div class="scanline"></div>

    <!-- UI Overlay -->
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between z-20 pointer-events-none text-xs md:text-sm">
        <div class="flex flex-col">
            <span class="text-gray-500">PROTOCOL</span>
            <span id="score-display" class="text-2xl text-white font-bold">LVL 00</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-gray-500">STATUS</span>
            <div id="lives-display" class="flex gap-1 text-red-500 text-xl">❤❤❤</div>
        </div>
    </div>

    <!-- Main Game Container -->
    <div id="game-container" class="relative z-10 w-full max-w-md h-full md:h-[600px] flex flex-col items-center justify-center p-6">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="flex flex-col items-center text-center gap-6">
            <h1 class="text-5xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">NEURO<br>RUSH</h1>
            <p class="text-sm text-gray-400 max-w-xs leading-relaxed">
                A rapid-fire test of your neural pathways.<br>
                React. Decide. Observe.<br>
                <span class="text-white font-bold">Don't think. Just act.</span>
            </p>
            <button onclick="game.start()" class="mt-4 px-8 py-3 bg-white text-black font-bold text-lg hover:bg-green-400 transition-colors uppercase tracking-widest clip-path-polygon">
                Initialize
            </button>
            <div class="text-xs text-gray-600 mt-8">
                Tap/Click or use Arrow Keys
            </div>
        </div>

        <!-- TRANSITION SCREEN -->
        <div id="transition-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-black z-30">
            <h2 id="level-title" class="text-3xl font-bold text-white mb-2 uppercase tracking-widest">REFLEX</h2>
            <p id="level-desc" class="text-green-400 font-mono text-sm animate-pulse">WAIT FOR GREEN</p>
        </div>

        <!-- GAMEPLAY LAYER -->
        <div id="gameplay-layer" class="hidden w-full h-full flex flex-col items-center justify-center relative">
            
            <!-- TIMER -->
            <div class="absolute top-0 w-full h-2 bg-gray-800 rounded-full overflow-hidden mb-4">
                <div id="timer-bar" class="h-full bg-white w-full"></div>
            </div>

            <div id="game-content" class="w-full flex-grow flex flex-col items-center justify-center">
                <!-- Dynamic Content Injected Here -->
            </div>

            <!-- Touch Controls (Visible only for certain levels) -->
            <div id="touch-controls" class="hidden w-full h-full absolute inset-0 flex">
                <div id="touch-left" class="w-1/2 h-full opacity-0 hover:opacity-5 transition-opacity bg-white cursor-pointer"></div>
                <div id="touch-right" class="w-1/2 h-full opacity-0 hover:opacity-5 transition-opacity bg-white cursor-pointer"></div>
            </div>
            <!-- Visual cues for touch (always visible for cognition) -->
            <div id="touch-visuals" class="hidden w-full absolute bottom-10 flex justify-between px-10 pointer-events-none">
                 <div class="arrow-key-btn p-4 text-2xl">← LEFT</div>
                 <div class="arrow-key-btn p-4 text-2xl">RIGHT →</div>
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="game-over-screen" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-50 text-center backdrop-blur-sm">
            <h2 class="text-4xl font-bold text-red-500 mb-2">FAILURE</h2>
            <p id="fail-reason" class="text-gray-400 text-sm mb-6">Reason: Too slow</p>
            <div class="mb-8">
                <span class="text-gray-500 text-xs uppercase">Final Level</span>
                <div id="final-score" class="text-5xl font-mono text-white">00</div>
            </div>
            <button onclick="game.reset()" class="px-8 py-3 border border-white text-white hover:bg-white hover:text-black transition-colors uppercase font-bold">
                Reboot System
            </button>
        </div>

    </div>

    <script>
        // Audio Context for beeps and buzzers (Simple oscillator based)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'tick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1000, now);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        /* --- Game Engine --- */

        const game = {
            level: 1,
            lives: 3,
            state: 'menu', // menu, transition, playing, gameover
            timer: null,
            timerInterval: null,
            maxTime: 0,
            currentTime: 0,
            
            // DOM Elements
            el: {
                start: document.getElementById('start-screen'),
                transition: document.getElementById('transition-screen'),
                gameplay: document.getElementById('gameplay-layer'),
                gameover: document.getElementById('game-over-screen'),
                content: document.getElementById('game-content'),
                score: document.getElementById('score-display'),
                lives: document.getElementById('lives-display'),
                levelTitle: document.getElementById('level-title'),
                levelDesc: document.getElementById('level-desc'),
                timerBar: document.getElementById('timer-bar'),
                failReason: document.getElementById('fail-reason'),
                finalScore: document.getElementById('final-score'),
                touchControls: document.getElementById('touch-controls'),
                touchVisuals: document.getElementById('touch-visuals'),
                touchLeft: document.getElementById('touch-left'),
                touchRight: document.getElementById('touch-right'),
                container: document.getElementById('game-container')
            },

            currentMiniGame: null,

            start() {
                this.level = 1;
                this.lives = 3;
                this.updateUI();
                this.el.start.classList.add('hidden');
                this.el.gameover.classList.add('hidden');
                this.nextLevel();
            },

            reset() {
                this.el.gameover.classList.add('hidden');
                this.el.start.classList.remove('hidden');
                this.el.gameplay.classList.add('hidden');
            },

            updateUI() {
                this.el.score.innerText = `LVL ${this.level.toString().padStart(2, '0')}`;
                this.el.lives.innerHTML = '❤'.repeat(this.lives);
            },

            nextLevel() {
                if (this.lives <= 0) {
                    this.gameOver("System Failure");
                    return;
                }

                this.state = 'transition';
                this.el.gameplay.classList.add('hidden');
                this.el.transition.classList.remove('hidden');

                // Select Game
                const types = ['reflex', 'precision', 'cognition', 'spot'];
                // Increase difficulty by adding more complex games or reducing time
                // Simply rotate for now, or random
                const type = types[Math.floor(Math.random() * types.length)];
                
                // Difficulty Multiplier
                const diff = Math.min(2.0, 1 + (this.level * 0.1));

                this.currentMiniGame = new MiniGames[type](diff);

                this.el.levelTitle.innerText = this.currentMiniGame.title;
                this.el.levelDesc.innerText = this.currentMiniGame.instruction;

                // Brief pause before start
                setTimeout(() => {
                    this.el.transition.classList.add('hidden');
                    this.playLevel();
                }, 1200);
            },

            playLevel() {
                this.state = 'playing';
                this.el.gameplay.classList.remove('hidden');
                
                // Clear content
                this.el.content.innerHTML = '';
                this.el.touchControls.classList.add('hidden');
                this.el.touchVisuals.classList.add('hidden');
                
                // Setup Game
                this.currentMiniGame.setup(this.el.content);

                // Start Timer
                this.maxTime = this.currentMiniGame.duration;
                this.currentTime = this.maxTime;
                
                // Reset timer bar color
                this.el.timerBar.style.backgroundColor = 'white';

                if (this.timerInterval) clearInterval(this.timerInterval);
                
                // Game Loop for timer and visuals
                const tickRate = 20; // ms
                this.timerInterval = setInterval(() => {
                    if (this.state !== 'playing') return;

                    this.currentTime -= tickRate;
                    
                    // Update Timer Bar
                    const pct = (this.currentTime / this.maxTime) * 100;
                    this.el.timerBar.style.width = `${pct}%`;

                    // Critical time color
                    if (pct < 30) this.el.timerBar.style.backgroundColor = '#ef4444';

                    // Update Game Logic (animations etc)
                    if (this.currentMiniGame.update) {
                        this.currentMiniGame.update(tickRate);
                    }

                    if (this.currentTime <= 0) {
                        this.handleResult(false, "Time Out");
                    }
                }, tickRate);
            },

            handleResult(success, reason) {
                clearInterval(this.timerInterval);
                this.state = 'result';
                
                if (success) {
                    playSound('success');
                    this.level++;
                    this.updateUI();
                    // Slight pause to show success state if needed, or instant
                    setTimeout(() => this.nextLevel(), 500);
                } else {
                    playSound('fail');
                    this.lives--;
                    this.updateUI();
                    this.el.container.classList.add('shake');
                    setTimeout(() => this.el.container.classList.remove('shake'), 500);

                    if (this.lives > 0) {
                        // Flash red overlay
                        const flash = document.createElement('div');
                        flash.className = 'absolute inset-0 bg-red-500/30 z-50 pointer-events-none';
                        document.body.appendChild(flash);
                        setTimeout(() => flash.remove(), 200);
                        
                        setTimeout(() => this.nextLevel(), 800);
                    } else {
                        setTimeout(() => this.gameOver(reason), 800);
                    }
                }
            },

            gameOver(reason) {
                this.state = 'gameover';
                this.el.failReason.innerText = `CAUSE: ${reason || 'Unknown'}`;
                this.el.finalScore.innerText = (this.level - 1).toString().padStart(2, '0');
                this.el.gameplay.classList.add('hidden');
                this.el.gameover.classList.remove('hidden');
            }
        };

        /* --- Mini Games --- */

        const MiniGames = {
            
            // 1. REFLEX: Click when green
            reflex: class {
                constructor(difficulty) {
                    this.title = "REFLEX";
                    this.instruction = "WAIT FOR GREEN";
                    this.duration = 4000; // Total time available to wait + react
                    this.triggered = false;
                    this.waiting = true;
                    // Random delay between 1s and 3s
                    this.delay = 1000 + Math.random() * 2000; 
                    this.timer = 0;
                    this.difficulty = difficulty;
                }

                setup(container) {
                    this.btn = document.createElement('div');
                    this.btn.className = "w-64 h-64 rounded-full border-4 border-gray-600 flex items-center justify-center text-xl font-bold transition-all cursor-pointer";
                    this.btn.style.backgroundColor = '#111';
                    this.btn.innerText = "WAIT";
                    this.btn.onmousedown = () => this.checkClick();
                    this.btn.ontouchstart = (e) => { e.preventDefault(); this.checkClick(); };
                    container.appendChild(this.btn);
                }

                update(dt) {
                    this.timer += dt;
                    if (this.waiting && this.timer >= this.delay) {
                        this.waiting = false;
                        this.triggered = true;
                        this.btn.style.backgroundColor = '#22c55e'; // Green
                        this.btn.style.borderColor = '#4ade80';
                        this.btn.style.boxShadow = '0 0 50px #22c55e';
                        this.btn.innerText = "CLICK!";
                        this.btn.classList.add('scale-110');
                        playSound('click');
                        // Reaction Window: decreases with difficulty
                        this.reactionWindow = 800 / this.difficulty; 
                        this.reactionTimer = 0;
                    }

                    if (this.triggered) {
                        this.reactionTimer += dt;
                        if (this.reactionTimer > this.reactionWindow) {
                            game.handleResult(false, "Too Slow");
                        }
                    }
                }

                checkClick() {
                    if (this.waiting) {
                        game.handleResult(false, "Too Early");
                    } else if (this.triggered) {
                        game.handleResult(true);
                    }
                }
            },

            // 2. PRECISION: Stop bar in middle
            precision: class {
                constructor(difficulty) {
                    this.title = "PRECISION";
                    this.instruction = "STOP IN CENTER";
                    this.duration = 3000;
                    // Speed increases with difficulty
                    this.speed = 2 + (difficulty * 0.5); 
                    this.pos = 0;
                    this.direction = 1;
                    this.stopped = false;
                }

                setup(container) {
                    // Container
                    const wrap = document.createElement('div');
                    wrap.className = "bar-container cursor-pointer";
                    
                    // Target Zone
                    const target = document.createElement('div');
                    target.className = "target-zone";
                    // Shrink target with difficulty
                    const targetWidth = Math.max(10, 25 - (this.difficulty * 2)); 
                    target.style.width = targetWidth + "%";
                    this.targetHalfWidth = targetWidth / 2;

                    // Marker
                    this.marker = document.createElement('div');
                    this.marker.className = "moving-marker";

                    wrap.appendChild(target);
                    wrap.appendChild(this.marker);
                    
                    // Click handler
                    const hit = () => this.checkStop();
                    wrap.onmousedown = hit;
                    wrap.ontouchstart = (e) => { e.preventDefault(); hit(); };
                    // Make whole screen clickable for easier mobile play
                    game.el.gameplay.onmousedown = hit;
                    game.el.gameplay.ontouchstart = (e) => { if(e.target !== wrap) hit(); };

                    container.appendChild(wrap);
                }

                update(dt) {
                    if (this.stopped) return;

                    this.pos += this.speed;
                    if (this.pos >= 100 || this.pos <= 0) {
                        this.direction *= -1;
                        this.speed *= -1; // Flip speed vector
                        playSound('tick');
                    }
                    this.marker.style.left = this.pos + "%";
                }

                checkStop() {
                    if (this.stopped) return;
                    this.stopped = true;
                    
                    // Remove global listeners
                    game.el.gameplay.onmousedown = null;
                    game.el.gameplay.ontouchstart = null;

                    // Calculate distance from center (50)
                    const dist = Math.abs(this.pos - 50);
                    
                    if (dist <= this.targetHalfWidth) {
                        this.marker.style.backgroundColor = '#00ff00';
                        game.handleResult(true);
                    } else {
                        this.marker.style.backgroundColor = '#ff0000';
                        game.handleResult(false, "Missed Target");
                    }
                }
            },

            // 3. COGNITION: Stroop/Direction
            cognition: class {
                constructor(difficulty) {
                    this.title = "COGNITION";
                    
                    // Randomize Rule
                    this.followArrow = Math.random() > 0.5;
                    this.instruction = this.followArrow ? "FOLLOW THE ARROW" : "FOLLOW THE TEXT";
                    
                    this.duration = Math.max(1000, 2500 - (difficulty * 200));

                    // Setup data
                    const dirs = ['LEFT', 'RIGHT'];
                    this.textDir = dirs[Math.floor(Math.random() * dirs.length)];
                    this.arrowDir = dirs[Math.floor(Math.random() * dirs.length)];
                    
                    // Determine correct answer
                    if (this.followArrow) {
                        this.correct = this.arrowDir;
                    } else {
                        this.correct = this.textDir;
                    }
                }

                setup(container) {
                    // Show Touch Controls UI
                    game.el.touchControls.classList.remove('hidden');
                    game.el.touchVisuals.classList.remove('hidden');

                    const wrap = document.createElement('div');
                    wrap.className = "flex flex-col items-center gap-8";

                    // The Text
                    const label = document.createElement('h1');
                    label.className = "text-6xl font-black tracking-wider";
                    label.innerText = this.textDir;
                    // Randomize color to confuse
                    label.style.color = Math.random() > 0.5 ? '#ef4444' : '#3b82f6';
                    
                    // The Arrow Icon
                    const icon = document.createElement('div');
                    icon.className = "text-8xl transition-transform";
                    // Using text arrow for simplicity, rotated via css
                    icon.innerText = "➜"; 
                    icon.style.transform = this.arrowDir === 'LEFT' ? 'rotate(180deg)' : 'rotate(0deg)';
                    icon.style.color = 'white';

                    wrap.appendChild(label);
                    wrap.appendChild(icon);
                    container.appendChild(wrap);

                    // Input Handlers
                    this.boundKeyHandler = this.handleKey.bind(this);
                    window.addEventListener('keydown', this.boundKeyHandler);

                    game.el.touchLeft.onclick = () => this.check('LEFT');
                    game.el.touchRight.onclick = () => this.check('RIGHT');
                }

                handleKey(e) {
                    if (e.key === "ArrowLeft") this.check('LEFT');
                    if (e.key === "ArrowRight") this.check('RIGHT');
                }

                check(input) {
                    window.removeEventListener('keydown', this.boundKeyHandler);
                    game.el.touchLeft.onclick = null;
                    game.el.touchRight.onclick = null;

                    if (input === this.correct) {
                        game.handleResult(true);
                    } else {
                        game.handleResult(false, "Wrong Direction");
                    }
                }

                // Cleanup needed for listeners if timed out
                update(dt) {
                    // If timeout happens, Game Engine handles it, but we should clean up listener
                    if (game.currentTime <= 20) {
                         window.removeEventListener('keydown', this.boundKeyHandler);
                    }
                }
            },

            // 4. SPOT: Find odd color
            spot: class {
                constructor(difficulty) {
                    this.title = "DETECTION";
                    this.instruction = "FIND THE ODD ONE";
                    this.duration = Math.max(1500, 4000 - (difficulty * 300));
                    
                    // Grid size increases with difficulty? Keeping 3x3 for speed but varying color subtlety
                    this.gridSize = 9;
                    this.targetIndex = Math.floor(Math.random() * this.gridSize);
                    
                    // Color logic
                    const baseHue = Math.floor(Math.random() * 360);
                    const baseSat = 60 + Math.random() * 20;
                    const baseLight = 50;
                    
                    // Difficulty determines lightness difference
                    const diff = Math.max(5, 20 - (difficulty * 3)); 
                    
                    this.baseColor = `hsl(${baseHue}, ${baseSat}%, ${baseLight}%)`;
                    this.targetColor = `hsl(${baseHue}, ${baseSat}%, ${baseLight + diff}%)`;
                }

                setup(container) {
                    const grid = document.createElement('div');
                    grid.className = "spot-grid";
                    
                    for(let i=0; i<this.gridSize; i++) {
                        const cell = document.createElement('div');
                        cell.className = "spot-cell";
                        cell.style.backgroundColor = (i === this.targetIndex) ? this.targetColor : this.baseColor;
                        
                        cell.onclick = () => {
                            if (i === this.targetIndex) {
                                game.handleResult(true);
                            } else {
                                cell.style.backgroundColor = 'red'; // Visual feedback
                                game.handleResult(false, "Wrong Target");
                            }
                        };
                        grid.appendChild(cell);
                    }
                    container.appendChild(grid);
                }
            }
        };

    </script>
</body>
</html>
